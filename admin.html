<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel admin - Fruty Batidos</title>
    <link rel="icon" href="img/logo.jpeg">
    <!-- Las mismas letras que usa la página principal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin">

        <!--
            Pantalla 1: el login.
            Cuando la persona le da a "Entrar", admin.js manda el correo
            y la contraseña al servidor sin recargar la página.
        -->
        <section id="vista-login" class="tarjeta">
            <img src="img/logo.jpeg" alt="Logo Fruty Batidos" class="admin-logo">
            <h1>Panel de administrador</h1>
            <p class="subtitulo">Entra para gestionar los productos</p>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="email">Correo</label>
                    <input type="email" id="email" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>

                <!-- Aquí aparecen los errores (contraseña mala, servidor apagado...) -->
                <p id="mensaje-error" class="mensaje-error" role="alert" hidden></p>

                <button type="submit" id="btn-entrar" class="boton">Entrar</button>
            </form>

            <a href="index.html" class="enlace-volver">← Volver a la página</a>
        </section>

        <!--
            Pantalla 2: el panel.
            Está escondida y solo se muestra si el que entró es administrador.
        -->
        <section id="vista-panel" class="tarjeta" hidden>
            <h1>Hola, <span id="nombre-admin"></span></h1>
            <p class="subtitulo">Sesión iniciada como administrador</p>
            <!-- Lista de productos: admin.js la llena con lo que viene de la base de datos -->
            <h2 class="titulo-lista">Productos</h2>
            <p id="estado-productos" class="nota">Cargando productos...</p>
            <ul id="lista-productos" class="lista-productos"></ul>
            <!-- Formulario para agregar un producto nuevo (solo lo ve un administrador) -->
            <h2 class="titulo-lista">Agregar producto</h2>
            <form id="form-producto" class="form-producto" novalidate>
                <div class="campo">
                    <label for="nombre-producto">Nombre</label>
                    <input type="text" id="nombre-producto" required>
                </div>
                <div class="campo">
                    <label for="precio-producto">Precio (en pesos)</label>
                    <input type="number" id="precio-producto" min="0" step="500" required>
                </div>
                <div class="campo">
                    <label for="descripcion-producto">Descripción (opcional)</label>
                    <input type="text" id="descripcion-producto">
                </div>
                <!-- Aquí sale el aviso de "Producto agregado" o el error -->
                <p id="mensaje-producto" class="mensaje-error" role="alert" hidden></p>
                <button type="submit" id="btn-agregar" class="boton">Agregar producto</button>
            </form>

            <button type="button" id="btn-salir" class="boton boton-secundario">Cerrar sesión</button>
        </section>

    </main>

    <script src="admin.js"></script>
</body>
</html>
